<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="62mm"
     viewBox="0 0 183 62" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="5.1" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.9 L5.4,3 L0,5.1 z" fill="#333333"/>
    </marker>
    <marker id="ahfb" markerWidth="6" markerHeight="6" refX="5.1" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.9 L5.4,3 L0,5.1 z" fill="#CC79A7"/>
    </marker>
  </defs>

  <!-- panel label -->
  <text x="1" y="5" font-size="3.5" font-weight="bold" fill="#000">a</text>

  <!-- ============ stage 1 : sample ============ -->
  <g>
    <rect x="4" y="9" width="36" height="28" rx="1.6"
          fill="#F2F7FB" stroke="#0072B2" stroke-width="0.35"/>
    <!-- tube icon -->
    <g stroke="#0072B2" stroke-width="0.4" fill="none">
      <path d="M18.4,14 L18.4,23.2 a1.6,1.6 0 0 0 3.2,0 L21.6,14 z" fill="#CFE6F5"/>
      <line x1="17.6" y1="14" x2="22.4" y2="14"/>
      <path d="M18.4,19.4 L21.6,19.4" stroke-dasharray="0.6 0.5"/>
    </g>
    <circle cx="19.4" cy="21.2" r="0.42" fill="#0072B2"/>
    <circle cx="20.7" cy="22.1" r="0.42" fill="#0072B2"/>
    <circle cx="20.1" cy="20.0" r="0.42" fill="#0072B2"/>
    <text x="22" y="29.6" font-size="2.9" font-weight="bold" fill="#0072B2"
          text-anchor="middle">Patient biopsy</text>
    <text x="22" y="33.4" font-size="2.4" fill="#555" text-anchor="middle">n = 24 donors</text>
  </g>

  <!-- ============ stage 2 : sorting ============ -->
  <g>
    <rect x="49" y="9" width="36" height="28" rx="1.6"
          fill="#F1FAF7" stroke="#009E73" stroke-width="0.35"/>
    <!-- microfluidic chip icon -->
    <g stroke="#009E73" stroke-width="0.4" fill="none">
      <rect x="57.5" y="14" width="19" height="10" rx="0.8" fill="#DAF2EA"/>
      <path d="M57.5,17.5 L64,17.5 L67.5,19 L76.5,19"/>
      <path d="M57.5,20.5 L64,20.5 L67.5,19"/>
      <circle cx="70.5" cy="19" r="0.55" fill="#009E73" stroke="none"/>
      <circle cx="73.0" cy="19" r="0.55" fill="#009E73" stroke="none"/>
    </g>
    <text x="67" y="29.6" font-size="2.9" font-weight="bold" fill="#009E73"
          text-anchor="middle">Microfluidic sorting</text>
    <text x="67" y="33.4" font-size="2.4" fill="#555" text-anchor="middle">CD45+ enrichment</text>
  </g>

  <!-- ============ stage 3 : sequencing ============ -->
  <g>
    <rect x="94" y="9" width="36" height="28" rx="1.6"
          fill="#FEF6EC" stroke="#E69F00" stroke-width="0.35"/>
    <!-- read pileup icon -->
    <g fill="#E69F00">
      <rect x="103" y="14.2" width="12" height="1.3" rx="0.5"/>
      <rect x="105.5" y="16.3" width="9.5" height="1.3" rx="0.5" opacity="0.8"/>
      <rect x="102" y="18.4" width="13.5" height="1.3" rx="0.5" opacity="0.62"/>
      <rect x="106.5" y="20.5" width="8" height="1.3" rx="0.5" opacity="0.45"/>
    </g>
    <line x1="101" y1="23.4" x2="119" y2="23.4" stroke="#E69F00" stroke-width="0.4"/>
    <text x="112" y="29.6" font-size="2.9" font-weight="bold" fill="#B87D00"
          text-anchor="middle">scRNA-seq</text>
    <text x="112" y="33.4" font-size="2.4" fill="#555" text-anchor="middle">61,402 cells</text>
  </g>

  <!-- ============ stage 4 : inference ============ -->
  <g>
    <rect x="139" y="9" width="40" height="28" rx="1.6"
          fill="#FDF3EE" stroke="#D55E00" stroke-width="0.35"/>
    <!-- small network icon -->
    <g stroke="#D55E00" stroke-width="0.3" fill="#D55E00">
      <line x1="150" y1="15" x2="156" y2="18.8"/><line x1="150" y1="18.8" x2="156" y2="18.8"/>
      <line x1="150" y1="22.6" x2="156" y2="18.8"/><line x1="156" y1="18.8" x2="162" y2="16.9"/>
      <line x1="156" y1="18.8" x2="162" y2="20.7"/>
      <circle cx="150" cy="15" r="0.85"/><circle cx="150" cy="18.8" r="0.85"/>
      <circle cx="150" cy="22.6" r="0.85"/><circle cx="156" cy="18.8" r="0.85"/>
      <circle cx="162" cy="16.9" r="0.85"/><circle cx="162" cy="20.7" r="0.85"/>
    </g>
    <text x="159" y="29.6" font-size="2.9" font-weight="bold" fill="#D55E00"
          text-anchor="middle">Cell-state model</text>
    <text x="159" y="33.4" font-size="2.4" fill="#555" text-anchor="middle">held-out AUC = 0.91</text>
  </g>

  <!-- ============ forward arrows ============ -->
  <g stroke="#333333" stroke-width="0.4" marker-end="url(#ah)" fill="none">
    <line x1="40.5" y1="23" x2="47.6" y2="23"/>
    <line x1="85.5" y1="23" x2="92.6" y2="23"/>
    <line x1="130.5" y1="23" x2="137.6" y2="23"/>
  </g>

  <!-- ============ feedback loop ============ -->
  <path d="M159,38.4 L159,45.5 L67,45.5 L67,38.6"
        fill="none" stroke="#CC79A7" stroke-width="0.4"
        stroke-dasharray="1.4 1.0" marker-end="url(#ahfb)"/>
  <rect x="97" y="43.3" width="32" height="4.6" fill="#ffffff"/>
  <text x="113" y="46.6" font-size="2.5" fill="#CC79A7" text-anchor="middle"
        font-style="italic">active-learning round (×3)</text>

  <!-- ============ caption ============ -->
  <text x="4" y="55.5" font-size="2.5" fill="#444">
    <tspan font-weight="bold">Fig. 1 | Study workflow.</tspan>
    <tspan>Biopsies from 24 donors were enriched for CD45+ leukocytes, profiled by</tspan>
  </text>
  <text x="4" y="59.3" font-size="2.5" fill="#444">scRNA-seq, and used to train a cell-state classifier; three active-learning rounds fed model uncertainty back into sorting gates.</text>
</svg>
