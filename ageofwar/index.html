/* 派生常量 */
const W = 1280, H = 720, LANE = BALANCE.laneY;
const BASE_HALF = 55, BASE_TOP = 130;                 // 基地半宽 / 高度
const P_FRONT = BALANCE.playerBaseX + BASE_HALF;      // 玩家基地正面（被攻击点）
const E_FRONT = BALANCE.enemyBaseX  - BASE_HALF;
const P_SPAWN = BALANCE.playerBaseX + BASE_HALF + 8;
const E_SPAWN = BALANCE.enemyBaseX  - BASE_HALF - 8;
const RANGED_MIN = 40;                                // range >= 40 视为远程
const BASE_SIEGE = 60;                                // 顶到基地这么近就直接砸基地

/* =====================================================================
   二、基础工具
   ===================================================================== */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const view = { scale:1, ox:0, oy:0, dpr:1 };

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.dpr = dpr;
  cv.width  = Math.max(1, Math.floor(innerWidth  * dpr));
  cv.height = Math.max(1, Math.floor(innerHeight * dpr));
  cv.style.width  = innerWidth  + 'px';
  cv.style.height = innerHeight + 'px';
  const s = Math.min(cv.width / W, cv.height / H);
  view.scale = s;
  view.ox = (cv.width  - W * s) / 2;
  view.oy = (cv.height - H * s) / 2;
}
addEventListener('resize', resize);

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rnd   = (a,b)=> a + Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(rnd(a,b+1));
function fmt(n){ n = Math.floor(n); return n >= 10000 ? (n/1000).toFixed(1)+'k' : String(n); }
function mmss(t){ const m = Math.floor(t/60), s = Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }

/* 绘图小工具 */
function rrect(x,y,w,h,r,fill,stroke,lw){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1.5; ctx.stroke(); }
}
function box(x,y,w,h,fill,stroke,lw){
  if(fill){ ctx.fillStyle = fill; ctx.fillRect(x,y,w,h); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1.5; ctx.strokeRect(x,y,w,h); }
}
function circ(x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1.5; ctx.stroke(); }
}
function limb(x1,y1,x2,y2,w,col){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function poly(pts,fill,stroke,lw){
  ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
  for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1.5; ctx.stroke(); }
}
function text(str,x,y,size,col,align,bold){
  ctx.font = (bold===false?'':'bold ')+size+'px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col; ctx.fillText(str,x,y);
}

/* 音效：WebAudio 合成，无外部资源 */
const Audio_ = {
  ac:null, muted:false,
  init(){ if(!this.ac){ try{ this.ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
          if(this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  play(type,freq,dur,vol,wave){
    if(this.muted || !this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = wave || 'square'; o.frequency.setValueAtTime(freq,t);
    if(type==='down') o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.35), t+dur);
    if(type==='up')   o.frequency.exponentialRampToValueAtTime(freq*2.2, t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t+dur+0.02);
  },
  hit(){   this.play('down', 220, 0.06, 0.05); },
  shoot(){ this.play('down', 620, 0.05, 0.035); },
  die(){   this.play('down', 150, 0.16, 0.05, 'sawtooth'); },
  buy(){   this.play('up',   480, 0.07, 0.05, 'triangle'); },
  deny(){  this.play('down', 160, 0.10, 0.05, 'sine'); },
  evolve(){ this.play('up',  330, 0.55, 0.07, 'triangle'); },
  boom(){  this.play('down', 90,  0.45, 0.09, 'sawtooth'); },
};

/* =====================================================================
   三、游戏状态
   ===================================================================== */

const G = {
  state:'menu',          // menu | playing | paused | over
  mode:'skirmish',       // skirmish | campaign
  level:1, difficulty:2, // 快速对战难度 / 战役当前关
  campaignBest:1,
  time:0, shake:0, flash:0, result:null,
  units:[], shots:[], parts:[], texts:[], fx:[],
  player:null, enemy:null,
  zones:[], hover:null, tip:null,
  panel:null,            // 'turret' 面板开关
};

function makeSide(isPlayer){
  return {
    isPlayer, dir: isPlayer ? 1 : -1,
    baseX: isPlayer ? BALANCE.playerBaseX : BALANCE.enemyBaseX,
    front: isPlayer ? P_FRONT : E_FRONT,
    spawnX: isPlayer ? P_SPAWN : E_SPAWN,
    hp: BALANCE.baseHp, maxHp: BALANCE.baseHp,
    gold: BALANCE.startGold, xp: 0, age: 1,
    queue: [], buildLeft: 0, buildTotal: 0, blocked:false,
    slots: 0,                       // 已购买的炮塔位数量
    turrets: [null,null,null,null], // 每个位置：{age, cd}
    charges: 1, chargeTimer: 0,
    kills: 0, earned: 0, incomeMult: 1,
    aiTimer: 0, hurt: 0,
  };
}

function startGame(mode, level){
  G.mode = mode;
  G.level = level || 1;
  const diff = mode === 'campaign' ? G.level : G.difficulty;
  G.diff = DIFFICULTY[clamp(diff,1,5)-1];
  G.player = makeSide(true);
  G.enemy  = makeSide(false);
  G.enemy.incomeMult = G.diff.income;
  G.units.length = 0; G.shots.length = 0; G.parts.length = 0;
  G.texts.length = 0; G.fx.length = 0;
  G.time = 0; G.shake = 0; G.flash = 0; G.result = null;
  G.panel = null; G.state = 'playing';
  Audio_.init();
}

/* =====================================================================
   四、单位 / 战斗逻辑
   ===================================================================== */

function unitList(side, aliveOnly){
  const out = [];
  for(const u of G.units) if(u.side === side && (!aliveOnly || !u.dead)) out.push(u);
  return out;
}
/* 本方最靠前（最接近敌方）的单位 */
function frontUnit(side){
  let best = null;
  for(const u of G.units){
    if(u.side !== side || u.dead) continue;
    if(!best || (u.x - best.x) * side.dir > 0) best = u;
  }
  return best;
}
function aliveCount(side){
  let n = 0; for(const u of G.units) if(u.side === side && !u.dead) n++;
  return n;
}

function spawnUnit(side, def, age){
  G.units.push({
    side, def, key:def.key, age,
    x: side.spawnX, hp: def.hp, maxHp: def.hp,
    cd: 0, anim: Math.random()*6, atk: 0, moving: true,
    dead: false, deathT: 0, flash: 0,
    ranged: def.range >= RANGED_MIN,
  });
}

function spawnBlocked(side){
  for(const u of G.units){
    if(u.side !== side || u.dead) continue;
    if(Math.abs(u.x - side.spawnX) < 30) return true;
  }
  return false;
}

function enqueue(side, idx){
  const def = UNITS[side.age][idx];
  if(!def) return false;
  if(side.queue.length >= BALANCE.queueMax) return false;
  if(side.gold < def.cost) return false;
  side.gold -= def.cost;
  side.queue.push({ def, age: side.age });
  return true;
}

function updateQueue(side, dt){
  if(side.queue.length === 0){ side.buildLeft = 0; side.buildTotal = 0; side.blocked = false; return; }
  if(side.buildTotal === 0){
    side.buildTotal = side.queue[0].def.buildTime;
    side.buildLeft  = side.buildTotal;
  }
  if(side.buildLeft > 0) side.buildLeft = Math.max(0, side.buildLeft - dt);
  if(side.buildLeft <= 0){
    if(spawnBlocked(side)){ side.blocked = true; return; }   // 堵门：出兵暂停
    side.blocked = false;
    const item = side.queue.shift();
    spawnUnit(side, item.def, item.age);
    side.buildTotal = 0; side.buildLeft = 0;
  }
}

function canEvolve(side){
  const a = AGES[side.age-1];
  return a.xpToNext !== null && side.xp >= a.xpToNext;
}
function evolve(side){
  if(!canEvolve(side)) return false;
  side.age++; side.xp = 0;
  side.charges = BALANCE.specialMaxCharges; side.chargeTimer = 0;  // 进化回满必杀
  if(side.isPlayer){ G.flash = 1; Audio_.evolve(); }
  pushText(side.baseX, LANE-BASE_TOP-30, '进化！'+AGES[side.age-1].name, side.isPlayer?'#7dd3fc':'#fca5a5', 2.0, 22);
  return true;
}

function otherSide(side){ return side === G.player ? G.enemy : G.player; }

/* 索敌：正前方最近的敌方单位；没有则打敌方基地 */
function findTarget(u){
  const foe = otherSide(u.side);
  // 已经顶到敌方基地墙根：直接砸基地，不再去追新刷出来的挡路兵
  // （否则防守方只要不断刷最便宜的兵挡路，基地就永远掉不了血）
  if(Math.abs(foe.front - u.x) <= Math.min(u.def.range, BASE_SIEGE))
    return { isBase:true, side:foe, x: foe.front };
  let best = null, bestD = 1e9;
  for(const e of G.units){
    if(e.side === foe && !e.dead){
      const dx = (e.x - u.x) * u.side.dir;
      if(dx < -6) continue;                       // 只打前方
      const d = Math.abs(e.x - u.x);
      if(d < bestD){ bestD = d; best = e; }
    }
  }
  if(best) return best;
  return { isBase:true, side:foe, x: foe.front };
}

function unitTop(u){ return LANE - (ART[u.key].h * 0.62 * ART_SCALE); }

function dealDamage(target, dmg, bySide){
  if(target.isBase){
    const s = target.side;
    s.hp = Math.max(0, s.hp - dmg);
    s.hurt = 0.25;
    G.shake = Math.max(G.shake, 3);
    return;
  }
  if(target.dead) return;
  target.hp -= dmg; target.flash = 0.12;
  if(target.hp <= 0){
    target.dead = true; target.deathT = 0.55;
    const d = target.def;
    bySide.gold   += d.gold * bySide.incomeMult;
    bySide.earned += d.gold * bySide.incomeMult;
    bySide.xp     += d.xp * bySide.incomeMult;
    bySide.kills++;
    pushText(target.x, unitTop(target)-6, '+'+Math.round(d.gold*bySide.incomeMult),
             bySide.isPlayer ? '#fcd34d' : '#fda4af', 0.9, 14);
    Audio_.die();
  }
}

function updateUnits(dt){
  // 按 x 排序，用于同阵营排队（不能互相穿过）
  const pl = unitList(G.player, true).sort((a,b)=>a.x-b.x);
  const en = unitList(G.enemy , true).sort((a,b)=>a.x-b.x);
  const ahead = new Map();
  for(let i=0;i<pl.length;i++) ahead.set(pl[i], pl[i+1] || null);          // 玩家：x 更大的是前面
  for(let i=en.length-1;i>=0;i--) ahead.set(en[i], en[i-1] || null);        // 敌方：x 更小的是前面

  for(const u of G.units){
    if(u.dead){ u.deathT -= dt; continue; }
    if(u.flash > 0) u.flash -= dt;
    if(u.atk   > 0) u.atk   = Math.max(0, u.atk - dt*3.2);
    if(u.cd    > 0) u.cd    -= dt;

    const t  = findTarget(u);
    const tx = t.x;
    const d  = Math.abs(tx - u.x);

    if(d <= u.def.range){
      u.moving = false;
      if(u.cd <= 0){
        u.cd = u.def.atkInterval; u.atk = 1;
        if(u.ranged){
          fireShot(u, t);
        }else{
          dealDamage(t, u.def.dmg, u.side);
          sparks(tx - u.side.dir*8, unitTop(u), u.side.isPlayer?'#bae6fd':'#fecaca', 5);
          Audio_.hit();
        }
      }
    }else{
      u.moving = true;
      let nx = u.x + u.side.dir * u.def.speed * dt;
      // 不越过攻击目标
      const stopAt = tx - u.side.dir * u.def.range;
      nx = u.side.dir > 0 ? Math.min(nx, stopAt) : Math.max(nx, stopAt);
      // 同阵营排队
      const a = ahead.get(u);
      if(a){
        nx = u.side.dir > 0 ? Math.min(nx, a.x - BALANCE.unitGap)
                            : Math.max(nx, a.x + BALANCE.unitGap);
      }
      // 不退后、不越界
      nx = u.side.dir > 0 ? Math.max(nx, u.x) : Math.min(nx, u.x);
      u.x = clamp(nx, P_FRONT - 4, E_FRONT + 4);
      u.anim += dt * (u.def.speed / 6);
    }
  }
  for(let i=G.units.length-1;i>=0;i--) if(G.units[i].dead && G.units[i].deathT <= 0) G.units.splice(i,1);
}

/* --- 弹丸 --- */
const SHOT_STYLE = {
  slinger:{type:'stone', sp:430}, archer:{type:'arrow', sp:520}, musketeer:{type:'bullet', sp:820},
  cannon:{type:'ball', sp:400, arc:1}, rifleman:{type:'bullet', sp:900}, bazooka:{type:'rocket', sp:420},
  tank:{type:'ball', sp:560, arc:1}, laser:{type:'laser', sp:1100}, plasma:{type:'plasma', sp:620},
  t1:{type:'stone', sp:430, arc:1}, t2:{type:'arrow', sp:560}, t3:{type:'ball', sp:480, arc:1},
  t4:{type:'rocket', sp:460}, t5:{type:'laser', sp:1200},
};

function fireShot(u, target){
  const st = SHOT_STYLE[u.key] || {type:'stone', sp:450};
  G.shots.push({
    side:u.side, x:u.x + u.side.dir*10, y:unitTop(u), target,
    tx:target.x, ty:target.isBase ? LANE-70 : unitTop(target),
    dmg:u.def.dmg, sp:st.sp, type:st.type, arc:st.arc?1:0, t:0, life:3,
  });
  Audio_.shoot();
}
function fireTurretShot(side, tx0, ty0, target, dmg, age){
  const st = SHOT_STYLE['t'+age];
  G.shots.push({
    side, x:tx0, y:ty0, target, tx:target.x, ty:target.isBase?LANE-70:unitTop(target),
    dmg, sp:st.sp, type:st.type, arc:st.arc?1:0, t:0, life:3,
  });
  Audio_.shoot();
}

function updateShots(dt){
  for(let i=G.shots.length-1;i>=0;i--){
    const s = G.shots[i];
    s.life -= dt;
    if(s.target && !s.target.isBase && !s.target.dead){ s.tx = s.target.x; s.ty = unitTop(s.target); }
    const dx = s.tx - s.x, dy = s.ty - s.y;
    const dist = Math.hypot(dx,dy);
    const step = s.sp * dt;
    s.ang = Math.atan2(dy,dx);
    if(dist <= step || s.life <= 0){
      if(s.life > 0 && s.target){
        if(s.target.isBase || !s.target.dead) dealDamage(s.target, s.dmg, s.side);
        const col = s.type==='laser' ? '#a5f3fc' : s.type==='rocket'||s.type==='ball' ? '#fbbf24' : '#fde68a';
        sparks(s.tx, s.ty, col, s.type==='ball'||s.type==='rocket'?10:5);
        if(s.type==='ball'||s.type==='rocket'){ Audio_.boom(); G.shake = Math.max(G.shake,2); }
        else Audio_.hit();
      }
      G.shots.splice(i,1); continue;
    }
    s.x += dx/dist*step; s.y += dy/dist*step;
    s.t += dt;
    if(s.arc){ s.y -= Math.sin(clamp(s.t*2.2,0,Math.PI)) * 26 * dt * 4; }
  }
}

/* --- 炮塔 --- */
function turretPos(side, i){
  const dx = -42 + i*28;
  return { x: side.baseX + dx * side.dir, y: LANE - BASE_TOP - 6 };
}
function turretCount(side){ let n=0; for(const t of side.turrets) if(t) n++; return n; }

function updateTurrets(side, dt){
  const foe = otherSide(side);
  for(let i=0;i<4;i++){
    const t = side.turrets[i];
    if(!t) continue;
    if(t.cd > 0) t.cd -= dt;
    const def = TURRETS[t.age];
    const p = turretPos(side, i);
    // 射程内、最靠近己方基地的敌人（优先拦截最深入的）
    let best = null, bestD = 1e9;
    for(const e of G.units){
      if(e.side !== foe || e.dead) continue;
      if(Math.abs(e.x - p.x) > def.range) continue;
      const d = Math.abs(e.x - side.baseX);
      if(d < bestD){ bestD = d; best = e; }
    }
    if(best && t.cd <= 0){
      t.cd = def.atkInterval; t.recoil = 1;
      fireTurretShot(side, p.x + side.dir*14, p.y - 6, best, def.dmg, t.age);
    }
    if(t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt*3);
  }
}

function buySlot(side){
  const cost = BALANCE.turretSlotCosts[side.slots];
  if(side.slots >= 4 || cost === undefined || side.gold < cost) return false;
  side.gold -= cost; side.slots++;
  return true;
}
function buildTurret(side, i){
  if(i >= side.slots || side.turrets[i]) return false;
  const def = TURRETS[side.age];
  if(side.gold < def.cost) return false;
  side.gold -= def.cost;
  side.turrets[i] = { age: side.age, cd: 0, recoil: 0 };
  return true;
}
function sellTurret(side, i){
  const t = side.turrets[i];
  if(!t) return false;
  side.gold += TURRETS[t.age].cost * BALANCE.turretRefund;
  side.turrets[i] = null;
  return true;
}

/* --- 必杀技 --- */
function useSpecial(side){
  if(side.charges <= 0) return false;
  side.charges--;
  const sp = SPECIALS[side.age];
  const foe = otherSide(side);
  G.fx.push({ kind:'special', age: side.age, side, t:0, dur:1.5 });
  G.shake = 16;
  Audio_.boom();
  // 全屏 AOE：对所有敌方单位造成固定伤害，不伤基地
  for(const e of G.units){
    if(e.side === foe && !e.dead) dealDamage(e, sp.dmg, side);
  }
  return true;
}
function updateCharges(side, dt){
  if(side.charges >= BALANCE.specialMaxCharges){ side.chargeTimer = 0; return; }
  side.chargeTimer += dt;
  if(side.chargeTimer >= BALANCE.specialRechargeSec){
    side.chargeTimer = 0; side.charges++;
  }
}

/* =====================================================================
   五、敌方 AI（与玩家规则完全相同，只有金币倍率/反应速度不同）
   ===================================================================== */

function updateAI(dt){ runAI(G.enemy, G.diff, dt); }

function runAI(s, d, dt){
  s.aiTimer -= dt;
  if(s.aiTimer > 0) return;
  s.aiTimer = d.reactionSec;

  // 1. 能进化就立刻进化
  if(canEvolve(s)){ evolve(s); return; }

  const defs = UNITS[s.age];
  const heavy = defs[2];
  const near = AGES[s.age-1].xpToNext !== null && s.xp >= AGES[s.age-1].xpToNext * 0.8;

  // 4. 炮塔
  const maxT = d.maxTurrets;
  if(turretCount(s) < maxT){
    const emptyOwned = s.turrets.findIndex((t,i)=> i < s.slots && !t);
    if(emptyOwned >= 0){
      if(s.gold > TURRETS[s.age].cost + 500) buildTurret(s, emptyOwned);
    }else if(s.slots < 4){
      const slotCost = BALANCE.turretSlotCosts[s.slots];
      if(s.gold > slotCost + TURRETS[s.age].cost + 500){
        buySlot(s); buildTurret(s, s.slots-1);
      }
    }
  }

  // 5. 必杀：基地附近敌人多，或血量告急
  let nearBase = 0;
  const foe = otherSide(s);
  for(const u of G.units) if(u.side === foe && !u.dead && Math.abs(u.x - s.baseX) < 400) nearBase++;
  const foeAlive = aliveCount(foe);
  const defend  = nearBase >= d.specialAt || (s.hp < s.maxHp*0.4 && nearBase >= 2);
  const attack  = s.charges >= BALANCE.specialMaxCharges && foeAlive >= d.specialAt + 1;   // 充能富余时用来清线开路
  if(s.charges > 0 && (defend || attack)) useSpecial(s);

  // 2/3. 出兵
  // 先保证前排有近战顶着：远程单位站在队首会按自己的射程停下，
  // 把后面的己方单位全堵在射程之外，双方就会隔空对峙谁也推不动。
  const front = frontUnit(s);
  const meleeQueued = s.queue.some(q => q.def.range < 100);
  if((!front || front.def.range >= 100) && !meleeQueued && s.gold >= defs[0].cost
     && s.queue.length < BALANCE.queueMax){
    enqueue(s, 0); return;
  }

  const rich = s.gold > heavy.cost * 2.5;
  if(aliveCount(s) < 3 || s.queue.length < 2 || rich){
    // 快进化了就存钱等重型兵
    if(near && s.gold >= heavy.cost*0.6 && s.gold < heavy.cost) return;
    const afford = [];
    for(let i=0;i<defs.length;i++) if(s.gold >= defs[i].cost) afford.push(i);
    if(afford.length === 0) return;
    const pick = Math.random() < 0.7 ? afford[afford.length-1] : afford[0];
    enqueue(s, pick);
  }
}

/* 防死局：双方都没兵、没队列、也买不起最便宜的兵时，各补一个最便宜兵的钱 */
function antiDeadlock(){
  const stuck = s => aliveCount(s)===0 && s.queue.length===0 && s.gold < UNITS[s.age][0].cost;
  if(stuck(G.player) && stuck(G.enemy)){
    G.player.gold = UNITS[G.player.age][0].cost;
    G.enemy.gold  = UNITS[G.enemy.age][0].cost;
  }
}

/* =====================================================================
   六、特效
   ===================================================================== */

function sparks(x,y,col,n){
  for(let i=0;i<n;i++){
    G.parts.push({ x, y, vx:rnd(-70,70), vy:rnd(-110,10), life:rnd(0.25,0.5), t:0,
                   col, r:rnd(1.2,2.8), g:260 });
  }
}
function dust(x,y,n,col){
  for(let i=0;i<n;i++){
    G.parts.push({ x:x+rnd(-14,14), y, vx:rnd(-40,40), vy:rnd(-60,-10), life:rnd(0.35,0.7), t:0,
                   col:col||'#cbb994', r:rnd(2,4.5), g:120 });
  }
}
function pushText(x,y,str,col,life,size){
  G.texts.push({ x, y, str, col, life, t:0, size:size||14 });
}
function updateFx(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const p = G.parts[i]; p.t += dt;
    if(p.t >= p.life){ G.parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt;
  }
  for(let i=G.texts.length-1;i>=0;i--){
    const t = G.texts[i]; t.t += dt;
    if(t.t >= t.life){ G.texts.splice(i,1); continue; }
    t.y -= 22*dt;
  }
  for(let i=G.fx.length-1;i>=0;i--){
    const f = G.fx[i]; f.t += dt;
    if(f.t >= f.dur) G.fx.splice(i,1);
  }
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*26);
  if(G.flash > 0) G.flash = Math.max(0, G.flash - dt*1.1);
  if(G.player) G.player.hurt = Math.max(0, G.player.hurt - dt);
  if(G.enemy)  G.enemy.hurt  = Math.max(0, G.enemy.hurt  - dt);
}

/* =====================================================================
   七、主更新
   ===================================================================== */

function step(dt){
  if(G.state !== 'playing'){ updateFx(dt); return; }
  G.time += dt;
  updateQueue(G.player, dt); updateQueue(G.enemy, dt);
  updateCharges(G.player, dt); updateCharges(G.enemy, dt);
  updateAI(dt);
  updateUnits(dt);
  updateTurrets(G.player, dt); updateTurrets(G.enemy, dt);
  updateShots(dt);
  updateFx(dt);
  antiDeadlock();
  if(G.enemy.hp <= 0 || G.player.hp <= 0) endGame(G.enemy.hp <= 0);
}

function endGame(win){
  G.state = 'over';
  G.result = {
    win,
    time: G.time, kills: G.player.kills,
    earned: G.player.earned, age: G.player.age,
    campaignDone: win && G.mode==='campaign' && G.level >= 5,
  };
  if(win && G.mode === 'campaign') G.campaignBest = Math.max(G.campaignBest, Math.min(5, G.level+1));
  Audio_.play(win?'up':'down', win?440:220, 0.6, 0.08, 'triangle');
}

/* 通用人形：h 高度，C 队伍色，sw 腿摆(-1..1)，返回肩膀坐标 */
function human(h, C, sw, opt){
  opt = opt || {};
  const hip = -h*0.44, sh = -h*0.72, hd = -h*0.855;
  limb(0, hip,  sw*h*0.17, -h*0.02, h*0.10, C.dark);
  limb(0, hip, -sw*h*0.17, -h*0.02, h*0.10, C.dark);
  rrect(-h*0.13, sh, h*0.27, hip - sh + h*0.05, h*0.07, C.main, C.line, 1.4);
  if(opt.cape) poly([-h*0.13,sh, -h*0.30,hip+h*0.10, -h*0.10,hip], C.dark, C.line, 1);
  circ(h*0.03, hd, h*0.115, opt.skin || SKIN, C.line, 1.3);
  if(opt.helmet){
    ctx.save(); ctx.beginPath(); ctx.arc(h*0.03, hd, h*0.135, Math.PI, Math.PI*2); ctx.closePath();
    ctx.fillStyle = opt.helmet; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
  }
  if(opt.hair){ poly([-h*0.09,hd-h*0.02, h*0.03,hd-h*0.19, h*0.14,hd-h*0.02], opt.hair, null); }
  return { sh, hip, hd };
}

function drawScene(age){
  const S = SCENES[age] || SCENES[1];
  const g = ctx.createLinearGradient(0,0,0,LANE);
  g.addColorStop(0, S.sky[0]); g.addColorStop(1, S.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,LANE);

  if(age === 5){ // 未来：星星
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for(let i=0;i<40;i++){ const x=(i*137)%W, y=(i*61)%330; ctx.fillRect(x, y, 2, 2); }
  }else{ // 云
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for(let i=0;i<5;i++){
      const x = ((i*271 + G.time*6) % (W+240)) - 120, y = 60 + i*34;
      circ(x, y, 22); circ(x+22, y+5, 17); circ(x-20, y+6, 15);
    }
  }

  // 远景剪影
  ctx.fillStyle = S.far;
  if(age === 1){
    for(let i=0;i<9;i++){ const x = 40+i*150; poly([x-60,LANE-40, x,LANE-125-((i*37)%40), x+62,LANE-40], S.far, null); }
  }else if(age === 2){
    for(let i=0;i<11;i++){ const x = i*120; box(x, LANE-90, 100, 50, S.far);
      for(let j=0;j<4;j++) box(x+j*26, LANE-104, 14, 16, S.far); }
  }else if(age === 3){
    for(let i=0;i<8;i++){ const x = 60+i*160; box(x, LANE-120, 46, 80, S.far);
      poly([x-8,LANE-120, x+54,LANE-120, x+23,LANE-152], S.far, null); }
  }else if(age === 4){
    for(let i=0;i<16;i++){ const h = 60+((i*53)%110); box(i*82, LANE-h-40, 62, h+40, S.far); }
  }else{
    for(let i=0;i<14;i++){ const h = 70+((i*67)%130); box(i*94, LANE-h-40, 70, h+40, S.far);
      ctx.fillStyle = 'rgba(103,232,249,.25)'; ctx.fillRect(i*94+8, LANE-h-30, 54, 4); ctx.fillStyle = S.far; }
  }

  // 地面
  box(0, LANE, W, 640-LANE, S.ground);
  box(0, LANE, W, 4, S.gdark);
  ctx.globalAlpha = .35;
  for(let i=0;i<W;i+=26) box(i + ((i*7)%9), LANE+12+((i*13)%16), 12, 3, S.gdark);
  ctx.globalAlpha = 1;
}

/* 单位渲染 */
function drawUnit(u){
  const A = ART[u.key]; if(!A) return;
  const C = u.side.isPlayer ? TEAM.p : TEAM.e;
  const sw = u.moving ? Math.sin(u.anim) : 0.12;
  ctx.save();
  ctx.translate(u.x, LANE);
  if(u.dead){
    const k = 1 - u.deathT/0.55;
    ctx.globalAlpha = Math.max(0, 1 - k*1.05);
    ctx.rotate(-u.side.dir * k * 1.35);
    ctx.translate(0, -k*2);
  }
  if(u.side.dir < 0) ctx.scale(-1,1);
  ctx.scale(ART_SCALE, ART_SCALE);
  // 影子
  ctx.globalAlpha *= .9;
  ctx.beginPath(); ctx.ellipse(0, 2, A.h*0.32, A.h*0.09, 0, 0, 7);
  ctx.fillStyle = 'rgba(0,0,0,.20)'; ctx.fill();
  ctx.globalAlpha /= .9;

  A.draw(u, C, sw, u.atk);

  if(u.flash > 0){
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,255,255,'+(u.flash*4)+')';
    ctx.fillRect(-40, -A.h-10, 80, A.h+16);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  // 血条（只在受伤后显示）
  if(!u.dead && u.hp < u.maxHp){
    const w = 30, x = u.x - w/2, y = LANE - A.h*ART_SCALE - 12;
    box(x-1, y-1, w+2, 6, 'rgba(0,0,0,.5)');
    box(x, y, w * clamp(u.hp/u.maxHp,0,1), 4, u.side.isPlayer ? '#4ade80' : '#f87171');
  }
}

function drawShot(s){
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang || 0);
  if(s.type === 'arrow'){
    limb(-9,0, 6,0, 2, '#8b5e34'); poly([6,-2.5, 12,0, 6,2.5], METAL, null);
    poly([-9,-3, -5,0, -9,3], '#e5e7eb', null);
  }else if(s.type === 'stone'){
    circ(0,0, 4, STONE, '#5b6169', 1);
  }else if(s.type === 'bullet'){
    ctx.globalAlpha = .8; box(-9,-1, 12, 2, '#fde68a'); ctx.globalAlpha = 1;
    circ(3,0, 1.8, '#fff7cf', null);
  }else if(s.type === 'ball'){
    circ(0,0, 5, '#3f4750', '#1f2429', 1.2);
  }else if(s.type === 'rocket'){
    rrect(-8,-3, 16, 6, 3, '#4b5563', '#1f242b', 1);
    poly([-8,-3, -18,0, -8,3], '#fb923c', null);
  }else if(s.type === 'laser'){
    ctx.globalAlpha = .9; rrect(-16,-2, 28, 4, 2, '#a5f3fc', null);
    ctx.globalAlpha = .5; rrect(-20,-4, 34, 8, 4, '#67e8f9', null); ctx.globalAlpha = 1;
  }else if(s.type === 'plasma'){
    ctx.globalAlpha = .5; circ(0,0, 9, '#fbbf24', null); ctx.globalAlpha = 1;
    circ(0,0, 4.5, '#fef3c7', null);
  }
  ctx.restore();
}

/* 必杀技演出 */
function drawSpecialFx(f){
  const k = f.t / f.dur;
  const forPlayer = f.side.isPlayer;
  const x0 = forPlayer ? 380 : 60, x1 = forPlayer ? 1240 : 900;
  ctx.save();
  if(f.age === 1){
    for(let i=0;i<26;i++){
      const seed = i*97 % 100;
      const px = x0 + ((seed*13) % (x1-x0));
      const delay = (seed%10)/16;
      const p = clamp((k - delay)*2.4, 0, 1);
      if(p <= 0 || p >= 1) continue;
      const py = -40 + p*(LANE+40);
      ctx.save(); ctx.translate(px, py); ctx.rotate(p*6);
      circ(0,0, 9 + (seed%5), '#8d7a62', '#4b4034', 2);
      ctx.restore();
      if(p > .92) dust(px, LANE, 1);
    }
  }else if(f.age === 2){
    for(let i=0;i<60;i++){
      const seed = i*61 % 100;
      const px = x0 + ((seed*17) % (x1-x0));
      const delay = (seed%12)/22;
      const p = clamp((k - delay)*2.6, 0, 1);
      if(p <= 0 || p >= 1) continue;
      const py = -60 + p*(LANE+60);
      ctx.save(); ctx.translate(px, py); ctx.rotate(1.15);
      limb(-10,-10, 8,8, 2, '#7c5c3a'); poly([8,8, 13,13, 6,12], METAL, null);
      ctx.restore();
    }
  }else if(f.age === 3){
    for(let i=0;i<16;i++){
      const seed = i*53 % 100;
      const px = x0 + ((seed*23) % (x1-x0));
      const delay = (seed%9)/12;
      const p = clamp((k - delay)*3.2, 0, 1);
      if(p <= 0 || p >= 1) continue;
      const r = p*46;
      ctx.globalAlpha = 1-p;
      circ(px, LANE-24, r, '#fbbf24', null);
      ctx.globalAlpha = (1-p)*0.8;
      circ(px, LANE-24, r*0.6, '#fff7cf', null);
      ctx.globalAlpha = 1;
    }
  }else if(f.age === 4){
    for(let i=0;i<3;i++){
      const px = (forPlayer ? -200 : W+200) + (forPlayer?1:-1) * (k*1.35+ i*0.16) * (W+420);
      const py = 90 + i*44;
      ctx.save(); ctx.translate(px, py); if(!forPlayer) ctx.scale(-1,1); ctx.scale(1.9,1.9);
      poly([-26,0, 16,-5, 30,0, 16,5], '#94a3b8', '#334155', 1.4);
      poly([-6,0, 6,-16, 12,0], '#cbd5e1', '#334155', 1.2);
      poly([-6,0, 6,16, 12,0], '#cbd5e1', '#334155', 1.2);
      circ(-14,0, 3, '#475569', null);
      ctx.restore();
    }
    for(let i=0;i<14;i++){
      const seed = i*71 % 100;
      const px = x0 + ((seed*19) % (x1-x0));
      const delay = 0.18 + (seed%8)/14;
      const p = clamp((k - delay)*3.4, 0, 1);
      if(p <= 0) continue;
      if(p < 1){
        ctx.globalAlpha = 1-p;
        circ(px, LANE-28, p*54, '#fb923c', null);
        circ(px, LANE-28, p*30, '#fff7cf', null);
        ctx.globalAlpha = 1;
      }
    }
  }else{
    for(let i=0;i<7;i++){
      const seed = i*41 % 100;
      const px = x0 + (i+0.5)*((x1-x0)/7);
      const delay = (seed%7)/16;
      const p = clamp((k - delay)*2.2, 0, 1);
      if(p <= 0 || p >= 1) continue;
      const a = Math.sin(p*Math.PI);
      ctx.globalAlpha = a*0.85;
      const grad = ctx.createLinearGradient(px,0,px,LANE);
      grad.addColorStop(0,'rgba(165,243,252,0)'); grad.addColorStop(1,'#a5f3fc');
      ctx.fillStyle = grad; ctx.fillRect(px-13, 0, 26, LANE);
      ctx.globalAlpha = a; ctx.fillStyle = '#fff';
      ctx.fillRect(px-4, 0, 8, LANE);
      ctx.globalAlpha = a*0.6; circ(px, LANE-6, 30, '#e0f2fe', null);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

/* =====================================================================
   十一、渲染主流程
   ===================================================================== */

function render(){
  G.zones.length = 0;
  G.tip = null;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#05070a'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();

  if(G.state === 'menu'){
    drawMenu();
  }else{
    const sx = G.shake ? rnd(-G.shake,G.shake)*0.4 : 0;
    const sy = G.shake ? rnd(-G.shake,G.shake)*0.4 : 0;
    ctx.save(); ctx.translate(sx, sy);
    drawScene(G.player.age);
    drawBase(G.enemy); drawBase(G.player);

    const order = G.units.slice().sort((a,b)=> (a.dead?0:1)-(b.dead?0:1) || a.x-b.x);
    for(const u of order) drawUnit(u);
    for(const s of G.shots) drawShot(s);
    for(const p of G.parts){
      ctx.globalAlpha = clamp(1 - p.t/p.life, 0, 1);
      circ(p.x, p.y, p.r, p.col, null);
    }
    ctx.globalAlpha = 1;
    for(const f of G.fx) if(f.kind === 'special') drawSpecialFx(f);
    for(const t of G.texts){
      ctx.globalAlpha = clamp(1 - t.t/t.life, 0, 1);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)';
      ctx.font = 'bold '+t.size+'px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.strokeText(t.str, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.str, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    // 基地受击红闪
    for(const s of [G.player, G.enemy]){
      if(s.hurt > 0){
        ctx.globalAlpha = s.hurt*1.6;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(s.baseX-BASE_HALF-4, LANE-BASE_TOP-10, BASE_HALF*2+8, BASE_TOP+10);
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();

    if(G.flash > 0){
      ctx.globalAlpha = G.flash*0.75; ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,BAR_Y); ctx.globalAlpha = 1;
    }

    drawHUD();
    drawBottomBar();
    if(G.panel === 'turret') drawTurretPanel();
    if(G.state === 'paused') drawPause();
    if(G.state === 'over') drawOver();
  }

  // hover / tooltip
  if(G.pointer && G.pointer.mouse){
    const z = hitZone(G.pointer.x, G.pointer.y);
    G.hover = z;
    if(z && z.tip) G.tip = { text:z.tip, x:z.x+z.w/2, y:z.y };
  }else G.hover = null;
  drawTooltip();

  ctx.restore();

  // 竖屏时在黑边里提示横屏（16:9 固定布局在竖屏手机上会被压得很小）
  if(cv.height > cv.width * 1.05 && view.oy > 26*view.dpr){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.font = 'bold ' + Math.round(15*view.dpr) + 'px system-ui,-apple-system,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#64748b';
    ctx.fillText('把手机横过来玩', cv.width/2, view.oy - 22*view.dpr);
  }
}

function hitZone(x,y){
  for(let i=G.zones.length-1;i>=0;i--){
    const z = G.zones[i];
    if(x>=z.x && x<=z.x+z.w && y>=z.y && y<=z.y+z.h) return z;
  }
  return null;
}

/* =====================================================================
   十二、输入
   ===================================================================== */

G.pointer = { x:-999, y:-999, mouse:false };

function toLogical(ev){
  const r = cv.getBoundingClientRect();
  const px = (ev.clientX - r.left) * view.dpr, py = (ev.clientY - r.top) * view.dpr;
  return { x:(px - view.ox)/view.scale, y:(py - view.oy)/view.scale };
}

cv.addEventListener('pointermove', ev=>{
  const p = toLogical(ev);
  G.pointer.x = p.x; G.pointer.y = p.y;
  G.pointer.mouse = ev.pointerType !== 'touch';
});
cv.addEventListener('pointerleave', ()=>{ G.pointer.mouse = false; });
cv.addEventListener('pointerdown', ev=>{
  ev.preventDefault();
  Audio_.init();
  const p = toLogical(ev);
  G.pointer.x = p.x; G.pointer.y = p.y;
  const z = hitZone(p.x, p.y);
  if(z) doAction(z.action, z.enabled);
  else if(G.panel === 'turret' && p.y < BAR_Y &&
          !(p.x>PANEL.x && p.x<PANEL.x+PANEL.w && p.y>PANEL.y && p.y<PANEL.y+PANEL.h)) G.panel = null;
});

addEventListener('keydown', ev=>{
  const k = ev.key.toLowerCase();
  if(G.state === 'menu'){
    if(k === 'enter'){ startGame('skirmish', G.difficulty); }
    return;
  }
  if(k === ' '){ ev.preventDefault(); doAction('pause'); return; }
  if(G.state !== 'playing') return;
  if(k === '1' || k === '2' || k === '3') doAction('unit'+(+k-1));
  else if(k === '4') doAction('evolve');
  else if(k === '5') doAction('special');
  else if('qwer'.includes(k)) doAction('slotkey'+'qwer'.indexOf(k));
  else if(k === 't') doAction('turretPanel');
});

function doAction(action, enabled){
  const P = G.player;
  if(action === undefined) return;

  // 菜单
  if(action === 'campaign'){ startGame('campaign', 1); return; }
  if(action === 'skirmish'){ startGame('skirmish', G.difficulty); return; }
  if(action.startsWith('diff')){ G.difficulty = +action.slice(4); Audio_.buy(); return; }

  // 结算
  if(action === 'again'){ startGame(G.mode, G.level); return; }
  if(action === 'next'){ startGame('campaign', Math.min(5, G.level+1)); return; }
  if(action === 'menu'){ G.state = 'menu'; return; }

  // 系统
  if(action === 'pause'){
    if(G.state === 'playing') G.state = 'paused';
    else if(G.state === 'paused') G.state = 'playing';
    return;
  }
  if(action === 'mute'){ Audio_.muted = !Audio_.muted; return; }
  if(action === 'quit'){ if(G.state==='playing'||G.state==='paused') G.state = 'menu'; return; }
  if(action === 'turretPanel'){ G.panel = G.panel === 'turret' ? null : 'turret'; return; }

  if(G.state !== 'playing') return;

  if(action.startsWith('unit')){
    if(enabled === false){ Audio_.deny(); return; }
    if(enqueue(P, +action.slice(4))) Audio_.buy(); else Audio_.deny();
    return;
  }
  if(action === 'evolve'){
    if(!evolve(P)) Audio_.deny();
    return;
  }
  if(action === 'special'){
    if(!useSpecial(P)) Audio_.deny();
    return;
  }
  if(action.startsWith('buyslot')){
    if(buySlot(P)) Audio_.buy(); else Audio_.deny();
    return;
  }
  if(action.startsWith('build')){
    if(buildTurret(P, +action.slice(5))) Audio_.buy(); else Audio_.deny();
    return;
  }
  if(action.startsWith('sell')){
    if(sellTurret(P, +action.slice(4))) Audio_.buy(); else Audio_.deny();
    return;
  }
  // Q/W/E/R：没买位就买位，空位就建塔
  if(action.startsWith('slotkey')){
    const i = +action.slice(7);
    if(i >= P.slots){ if(i === P.slots && buySlot(P)) Audio_.buy(); else Audio_.deny(); }
    else if(!P.turrets[i]){ if(buildTurret(P,i)) Audio_.buy(); else Audio_.deny(); }
    else Audio_.deny();
    return;
  }
}

/* =====================================================================
   十三、主循环（固定时间步长 1/60）
   ===================================================================== */

const STEP = 1/60;
let acc = 0, last = performance.now();

function frame(now){
  let dt = (now - last) / 1000; last = now;
  if(dt > 0.25) dt = 0.25;          // 切后台回来不要一次跑几百帧
  acc += dt;
  let guard = 0;
  while(acc >= STEP && guard++ < 8){ step(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

// 调试/自动测试用钩子
window.__game = G;
window.__dbg = { step, runAI, startGame, DIFFICULTY, AGES, UNITS, TURRETS, BALANCE, aliveCount,
  enqueueP:i=>enqueue(G.player,i), evolveP:()=>evolve(G.player), specialP:()=>useSpecial(G.player) };
</script>
