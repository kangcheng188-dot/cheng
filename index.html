<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08110e"><title>毒师宇宙 MBTI 人格档案</title><style>html,body{margin:0;min-height:100%;background:#07100d;color:#f4f6ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:520px}.ring{width:42px;height:42px;border:4px solid #284438;border-top-color:#c9ef65;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#99aa9e}</style></head><body><div class="loading"><div class="box"><div class="ring"></div><h2>正在载入毒师宇宙人格档案</h2><small>首次打开需要下载网页数据，之后可正常搜索、筛选和点击人物。</small></div></div><script>
(async()=>{try{const names=Array.from({length:6},(_,i)=>`parts/p${i+1}.txt`);const texts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'force-cache'});if(!r.ok)throw new Error(n);return r.text()}));const b64=texts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html;if('DecompressionStream' in window){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));html=await new Response(stream).text()}else{await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)});html=new TextDecoder().decode(window.pako.ungzip(bytes))}document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><h2>网页载入失败</h2><p>请刷新页面，或换用 Safari/Chrome 再试一次。</p><small>'+String(e)+'</small></div></div>'}})();
</script></body></html>
