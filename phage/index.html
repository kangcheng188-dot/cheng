<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#03070b">
<title>Phage Wars Reborn</title>
<style>
:root{--c:#20f0e7;--p:#ff43c7;--y:#eaff35;--o:#ff8b38;--bg:#020509;--panel:rgba(3,10,15,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020509;color:#dff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}button{font:inherit;color:inherit}
#app,#game{position:fixed;inset:0}#game{display:block;width:100%;height:100%;background:radial-gradient(circle at 50% 42%,#152027 0,#04080d 55%,#010204 100%)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 4px)}
.hud{position:fixed;z-index:8;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.box{pointer-events:auto;border:1px solid rgba(130,240,255,.25);background:rgba(2,8,12,.72);backdrop-filter:blur(7px);padding:8px 10px;font-size:11px;line-height:1.55;box-shadow:inset 0 0 22px rgba(32,240,231,.04)}.box b{font-size:13px;color:#eff}.actions{display:flex;gap:6px}.actions button{pointer-events:auto;width:43px;height:41px;border:1px solid rgba(130,240,255,.28);background:rgba(2,8,12,.78);font-size:17px}
.tip{position:fixed;z-index:7;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(130,240,255,.22);background:rgba(2,8,12,.75);padding:8px 12px;font-size:10px;color:#8eb0b7;pointer-events:none}
.overlay{position:fixed;z-index:12;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,3,6,.82);backdrop-filter:blur(5px)}.overlay.show{display:flex}.panel{width:min(700px,96vw);max-height:92vh;overflow:auto;touch-action:pan-y;border:1px solid rgba(100,235,255,.32);background:linear-gradient(145deg,rgba(9,21,28,.97),rgba(2,7,11,.98));padding:22px;box-shadow:0 0 70px #000}.logo{font-weight:900;font-size:clamp(31px,9vw,72px);letter-spacing:.08em;text-align:center;color:#eff;text-shadow:0 0 12px var(--c),0 0 35px rgba(32,240,231,.42)}.sub{text-align:center;letter-spacing:.32em;color:var(--c);font-size:10px;margin:8px 0 24px}.desc{color:#8daeb5;font-size:12px;line-height:1.8;text-align:center;max-width:560px;margin:0 auto 18px}.primary,.secondary{border:1px solid rgba(32,240,231,.65);background:rgba(11,45,50,.65);padding:13px 18px;min-width:190px;margin:6px;letter-spacing:.13em}.secondary{border-color:rgba(130,240,255,.25);background:#071116}.center{text-align:center}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.lv{min-height:68px;border:1px solid rgba(130,240,255,.2);background:rgba(4,13,18,.85);position:relative;padding:10px;text-align:left}.lv strong{font-size:16px}.lv small{display:block;margin-top:14px;color:#65858c}.lv.done{border-color:rgba(70,255,165,.45)}.lv.lock{opacity:.28}.lv.current{border-color:var(--c);box-shadow:inset 0 0 20px rgba(32,240,231,.08)}
.result h2{text-align:center;letter-spacing:.16em}.result p{text-align:center;color:#86a5ac;line-height:1.7}.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px 0;color:#8baab0;font-size:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;box-shadow:0 0 7px currentColor}
@media(max-width:520px){.panel{padding:17px}.levels{grid-template-columns:repeat(3,1fr)}.lv{min-height:62px}.desc{font-size:11px}.box{font-size:9px;padding:7px 8px}.box b{font-size:11px}}
</style>
</head>
<body>
<div id="app"><canvas id="game"></canvas><div class="scan"></div>
<div class="hud"><div class="box"><b id="stage">EXPERIMENT 01</b><br><span id="status">CELLS 0 / 0 · 0:00</span></div><div class="actions"><button id="restart" aria-label="重开">↻</button><button id="menu" aria-label="菜单">☰</button></div></div>
<div class="tip" id="tip">按住青色细胞，拖到目标细胞；每次会派出约一半病毒</div>
<div class="overlay show" id="home"><div class="panel"><div class="logo">PHAGE WARS</div><div class="sub">REBORN · MOBILE EDITION</div><p class="desc">控制青色病毒。细胞会不断繁殖，拖动连接即可派出病毒；数量归零后目标会被同化。占领培养皿内的全部细胞即可获胜。</p><div class="legend"><span><i class="dot" style="color:var(--c);background:var(--c)"></i>玩家</span><span><i class="dot" style="color:var(--p);background:var(--p)"></i>敌对病毒</span><span><i class="dot" style="color:#dbe6e8;background:#dbe6e8"></i>中立细胞</span></div><div class="center"><button class="primary" id="continue">开始实验</button><button class="secondary" id="choose">选择关卡</button></div></div></div>
<div class="overlay" id="select"><div class="panel"><div class="center"><b>EXPERIMENT ARCHIVE</b></div><div class="levels" id="levels"></div><div class="center"><button class="secondary" id="back">返回</button></div></div></div>
<div class="overlay" id="result"><div class="panel result"><h2 id="resultTitle">实验完成</h2><p id="resultText"></p><div class="center"><button class="primary" id="next">下一关</button><button class="secondary" id="again">重新开始</button><button class="secondary" id="resultMenu">实验列表</button></div></div></div>
</div>
<script>
(()=>{'use strict';
const C={neutral:'#d8e3e5',player:'#20f0e7',enemy1:'#ff43c7',enemy2:'#eaff35',enemy3:'#ff8b38'};
const cv=document.querySelector('#game'),x=cv.getContext('2d'),$=s=>document.querySelector(s),TAU=Math.PI*2;
let W=0,H=0,D=1,cells=[],packets=[],fx=[],selected=new Set(),drag=null,last=0,elapsed=0,aiClock=0,ended=false,running=false,level=1;
let unlocked=+localStorage.getItem('phageUnlocked')||1,completed=+localStorage.getItem('phageCompleted')||0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const owners=['enemy1','enemy2','enemy3'];
function resize(){const ow=W||innerWidth,oh=H||innerHeight;W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';x.setTransform(D,0,0,D,0,0);if(cells.length&&ow&&oh){for(const c of cells){c.x*=W/ow;c.y*=H/oh;c.r*=Math.sqrt((W/ow)*(H/oh))}}}
addEventListener('resize',resize);resize();
function seeded(n){let s=(n*9301+49297)%233280;return()=>((s=(s*9301+49297)%233280)/233280)}
function makeLevel(n){level=n;elapsed=0;aiClock=0;ended=false;packets=[];fx=[];selected.clear();const r=seeded(n),count=Math.min(7+Math.floor(n*.55),18),enemyCount=n<5?1:n<11?2:3;cells=[];
 const minR=H<600?23:27,maxR=H<600?36:44;
 function add(owner,px,py,rad,energy,growth=1){cells.push({id:cells.length,owner,x:px*W,y:py*H,r:rad,energy,max:Math.round(rad*2.35),growth,pulse:r()*TAU})}
 add('player',.16,.52,minR+8,18,1.12);
 for(let e=0;e<enemyCount;e++){const a=(e/(enemyCount))*TAU+.15;add(owners[e],.72+Math.cos(a)*.13,.5+Math.sin(a)*.25,minR+6,16+n*.6,1+.035*n)}
 let tries=0;while(cells.length<count&&tries++<800){const px=.1+r()*.8,py=.14+r()*.72,rad=minR+r()*(maxR-minR);const tmp={x:px*W,y:py*H,r:rad};if(cells.every(c=>dist(c,tmp)>c.r+rad+22)){let typeRoll=r(),growth=typeRoll>.82?1.55:typeRoll<.16?.72:1;add('neutral',px,py,rad,Math.round(5+r()*(18+n*.7)),growth)}}
 $('#stage').textContent='EXPERIMENT '+String(n).padStart(2,'0');$('#result').classList.remove('show');running=true;last=performance.now();requestAnimationFrame(loop)}
function stats(owner){if(owner==='player')return{growth:1.05,attack:1.06,speed:1.04};const i=owners.indexOf(owner);return{growth:1+nScale(.008+i*.006),attack:1+nScale(.006+i*.008),speed:1+nScale(.004+i*.007)}}
function nScale(v){return level*v}
function spawn(source,target,amount,owner){const count=clamp(Math.ceil(amount/3.2),3,22),power=amount/count,s=stats(owner);for(let i=0;i<count;i++)setTimeout(()=>{if(ended||!running)return;const a=Math.atan2(target.y-source.y,target.x-source.x)+rnd(-.09,.09);packets.push({x:source.x+Math.cos(a)*source.r*.7,y:source.y+Math.sin(a)*source.r*.7,target:target.id,owner,power,speed:(145+level*2)*s.speed,w:rnd(-1,1)})},i*32)}
function send(ids,target,owner='player'){let ok=false;for(const id of ids){const c=cells.find(v=>v.id===id);if(!c||c.owner!==owner||c.id===target.id||c.energy<2)continue;const amount=Math.floor(c.energy*.5);c.energy-=amount;spawn(c,target,amount,owner);ok=true}if(ok){selected.clear();navigator.vibrate?.(8)}}
function ai(){for(const owner of owners){const src=cells.filter(c=>c.owner===owner&&c.energy>9).sort((a,b)=>b.energy-a.energy);if(!src.length)continue;const targets=cells.filter(c=>c.owner!==owner).sort((a,b)=>(a.energy+dist(src[0],a)*.045)-(b.energy+dist(src[0],b)*.045));if(!targets.length)continue;const t=targets[0],s=src[0];if(s.energy>t.energy*.58+4||Math.random()<.18)send(src.filter(c=>dist(c,t)<Math.min(W,H)*.75).slice(0,Math.random()<.23?2:1).map(c=>c.id),t,owner)}}
function update(dt){elapsed+=dt;aiClock+=dt;for(const c of cells){c.pulse+=dt*(1.2+c.growth*.15);if(c.owner!=='neutral')c.energy=Math.min(c.max,c.energy+dt*.82*c.growth*stats(c.owner).growth);else if(c.energy<c.max*.62)c.energy=Math.min(c.max*.62,c.energy+dt*.11)}
 for(let i=packets.length-1;i>=0;i--){const p=packets[i],t=cells[p.target];if(!t){packets.splice(i,1);continue}const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*p.speed*dt;p.y+=dy/d*p.speed*dt;p.x+=Math.sin(elapsed*8+i)*p.w*.3;if(d<t.r+5){const atk=stats(p.owner).attack;if(t.owner===p.owner)t.energy=Math.min(t.max,t.energy+p.power*atk);else{t.energy-=p.power*atk;if(t.energy<=0){const old=t.owner;t.owner=p.owner;t.energy=Math.min(t.max,Math.max(1,-t.energy));burst(t.x,t.y,C[t.owner],14);if(old==='player')selected.delete(t.id)}}packets.splice(i,1)}}
 if(aiClock>Math.max(.55,1.28-level*.018)){aiClock=0;ai()}checkEnd();updateHud()}
function checkEnd(){if(ended)return;const hasPlayer=cells.some(c=>c.owner==='player');if(!hasPlayer)return finish(false);if(cells.every(c=>c.owner==='player'))finish(true)}
function finish(win){ended=true;running=false;setTimeout(()=>{if(win){completed=Math.max(completed,level);unlocked=Math.max(unlocked,Math.min(16,level+1));localStorage.setItem('phageCompleted',completed);localStorage.setItem('phageUnlocked',unlocked);$('#resultTitle').textContent='EXPERIMENT COMPLETE';$('#resultText').textContent=`培养皿已完全同化。完成时间 ${fmt(elapsed)}。`;$('#next').style.display=level<16?'inline-block':'none'}else{$('#resultTitle').textContent='SUBJECT TERMINATED';$('#resultText').textContent='你的病毒已经被清除。先抢占较弱的中立细胞，建立数量优势后再进攻。';$('#next').style.display='none'}$('#result').classList.add('show')},350)}
function updateHud(){const p=cells.filter(c=>c.owner==='player').length;$('#status').textContent=`CELLS ${p} / ${cells.length} · ${fmt(elapsed)}`}
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function burst(px,py,col,n){for(let i=0;i<n;i++)fx.push({x:px,y:py,vx:rnd(-75,75),vy:rnd(-75,75),life:rnd(.25,.7),col})}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function draw(){x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,W,H);const g=x.createRadialGradient(W*.48,H*.44,20,W*.5,H*.5,Math.max(W,H)*.76);g.addColorStop(0,'#18252b');g.addColorStop(.5,'#071016');g.addColorStop(1,'#010204');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.globalAlpha=.18;for(let i=0;i<35;i++){const px=(Math.sin(i*73.2+level)*.5+.5)*W,py=(Math.sin(i*41.7+level*2)*.5+.5)*H;x.fillStyle='#bfe9ef';x.beginPath();x.arc(px,py,1+i%5,0,TAU);x.fill()}x.globalAlpha=1;
 for(const c of cells)drawCell(c);if(drag&&selected.size){x.save();x.setLineDash([5,5]);x.strokeStyle='rgba(220,255,255,.55)';for(const id of selected){const c=cells[id];x.beginPath();x.moveTo(c.x,c.y);x.lineTo(drag.x,drag.y);x.stroke()}x.restore()}
 for(const p of packets){const t=cells[p.target];if(!t)continue;const a=Math.atan2(t.y-p.y,t.x-p.x);x.save();x.translate(p.x,p.y);x.rotate(a);x.shadowColor=C[p.owner];x.shadowBlur=9;x.fillStyle=C[p.owner];x.beginPath();x.ellipse(0,0,6,2,0,0,TAU);x.fill();x.globalAlpha=.25;x.beginPath();x.ellipse(-7,0,9,1,0,0,TAU);x.fill();x.restore()}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=.016;f.x+=f.vx*.016;f.y+=f.vy*.016;if(f.life<=0){fx.splice(i,1);continue}x.fillStyle=rgba(f.col,clamp(f.life*2,0,1));x.beginPath();x.arc(f.x,f.y,2.3,0,TAU);x.fill()}}
function drawCell(c){const col=C[c.owner],sel=selected.has(c.id),breath=1+Math.sin(c.pulse)*.025;x.save();x.translate(c.x,c.y);x.scale(breath,breath);x.shadowColor=col;x.shadowBlur=c.owner==='neutral'?5:14;x.strokeStyle=c.owner==='neutral'?'rgba(220,235,238,.38)':rgba(col,.78);x.lineWidth=sel?3:1.5;x.beginPath();x.arc(0,0,c.r,0,TAU);x.stroke();for(let k=1;k<3;k++){x.strokeStyle=rgba(col,.13/k);x.lineWidth=1;x.beginPath();x.arc(0,0,c.r*(1-k*.13),0,TAU);x.stroke()}x.globalAlpha=.22;x.fillStyle=col;for(let i=0;i<7;i++){const a=i*2.39+c.pulse*.07,rr=c.r*(.24+(i%3)*.17);x.beginPath();x.arc(Math.cos(a)*rr,Math.sin(a)*rr,2+i%3,0,TAU);x.fill()}x.globalAlpha=1;x.fillStyle='rgba(0,3,6,.62)';x.beginPath();x.arc(0,0,c.r*.44,0,TAU);x.fill();x.fillStyle=col;x.font=`700 ${clamp(c.r*.48,13,23)}px ui-monospace`;x.textAlign='center';x.textBaseline='middle';x.fillText(Math.floor(c.energy),0,1);x.shadowBlur=0;x.strokeStyle=rgba(col,.35);x.lineWidth=2;x.beginPath();x.arc(0,0,c.r+4,-Math.PI/2,-Math.PI/2+TAU*clamp(c.energy/c.max,0,1));x.stroke();if(sel){x.setLineDash([5,4]);x.strokeStyle='#fff';x.beginPath();x.arc(0,0,c.r+9,0,TAU);x.stroke()}x.restore()}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hit(p){for(let i=cells.length-1;i>=0;i--){const c=cells[i];if(Math.hypot(c.x-p.x,c.y-p.y)<c.r+11)return c}}
cv.addEventListener('pointerdown',e=>{if(!running||ended)return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e),c=hit(p);drag={x:p.x,y:p.y,start:c?.id,moved:false};if(c?.owner==='player'){selected.add(c.id)}else if(!c)selected.clear()});
cv.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=pos(e);if(Math.hypot(p.x-drag.x,p.y-drag.y)>2)drag.moved=true;drag.x=p.x;drag.y=p.y;const c=hit(p);if(c?.owner==='player')selected.add(c.id)});
cv.addEventListener('pointerup',e=>{if(!drag)return;e.preventDefault();const p=pos(e),c=hit(p),m=drag.moved,start=drag.start;drag=null;if(c&&selected.size&&c.owner!=='player')return send([...selected],c);if(c&&selected.size&&c.owner==='player'&&m&&c.id!==start){const ids=[...selected].filter(id=>id!==c.id);return send(ids,c)}if(!c)selected.clear()});cv.addEventListener('contextmenu',e=>e.preventDefault());
function show(id){for(const o of document.querySelectorAll('.overlay'))o.classList.remove('show');if(id!=='#none')$(id).classList.add('show')}
function buildLevels(){const el=$('#levels');el.innerHTML='';for(let i=1;i<=16;i++){const b=document.createElement('button');b.className='lv '+(i>unlocked?'lock':i<=completed?'done':i===unlocked?'current':'');b.innerHTML=`<strong>${String(i).padStart(2,'0')}</strong><small>${i>unlocked?'LOCKED':i<=completed?'CLEARED':'AVAILABLE'}</small>`;b.onclick=()=>{if(i<=unlocked){show('#none');makeLevel(i)}};el.appendChild(b)}}
$('#continue').onclick=()=>{show('#none');makeLevel(Math.min(unlocked,16))};$('#choose').onclick=()=>{buildLevels();show('#select')};$('#back').onclick=()=>show('#home');$('#menu').onclick=()=>{running=false;buildLevels();show('#select')};$('#restart').onclick=()=>makeLevel(level);$('#again').onclick=()=>makeLevel(level);$('#next').onclick=()=>makeLevel(Math.min(16,level+1));$('#resultMenu').onclick=()=>{buildLevels();show('#select')};
window.addEventListener('load',()=>setTimeout(()=>$('#tip').style.opacity=.25,6500));
})();
</script>
</body></html>
